apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-app-deployment
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletest-container
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "30Mi"
            requests:
              cpu: "100m" # Запрос на 1/10 ядра
              memory: "10Mi" # Запрос на 10 MiB памяти